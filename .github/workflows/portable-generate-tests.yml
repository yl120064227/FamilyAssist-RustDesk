name: Portable package regression tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "build.py"
      - "libs/portable/generate.py"
      - "libs/portable/requirements.txt"
      - "tests/test_portable_generate.py"
      - ".github/workflows/portable-generate-tests.yml"
  push:
    branches:
      - main
    paths:
      - "build.py"
      - "libs/portable/generate.py"
      - "libs/portable/requirements.txt"
      - "tests/test_portable_generate.py"
      - ".github/workflows/portable-generate-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the existing packer dependency
        run: python -m pip install -r libs/portable/requirements.txt
      - name: Run portable package regression tests
        run: python -m unittest discover -s tests -p test_portable_generate.py -v
